events { worker_connections 1024; }
http {
    # $uri excludes query strings carrying patient identifiers.
    log_format safe '$remote_addr $request_method $uri $status $request_time';
    access_log /var/log/nginx/access.log safe;
    # Request failures can include raw URLs in nginx error logs.
    error_log /var/log/nginx/error.log crit;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    server {
        listen 80;
        server_tokens off;
        client_max_body_size 8k;
        add_header X-Content-Type-Options nosniff always;
        location /staff/ {
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 30s;
        }
        location / {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 30s;
        }
    }
}
